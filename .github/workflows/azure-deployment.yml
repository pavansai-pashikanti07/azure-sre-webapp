name: CI-CD Pipeline - Build, Test & Deploy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke Test Application Load
      run: |
        python -c "import app; print('✅ Flask App initialized successfully!')"

    - name: Upload Artifact for Deployment
      uses: actions/upload-artifact@v4
      with:
        name: webapp-package
        path: |
          .
          !.git
          !.github

  deploy_to_azure:
    name: 🚀 Deploy to Azure Web App
    needs: build_and_test
    runs-on: ubuntu-latest
    
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp-package

    - name: Deploy to Azure Web App (PaaS)
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'prep-web-lb'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B960D286554B4F1498E9574FEF49728B }}
        package: .
